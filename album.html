<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📸 拍立得照片墙</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #f5f0eb;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ====== Header ====== */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(245,240,235,0.92);
    backdrop-filter: blur(10px);
    padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .header h1 {
    font-size: 20px; font-weight: 700; color: #2c2c2c;
    letter-spacing: -0.5px;
  }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .sync-badge {
    font-size: 11px; padding: 4px 10px; border-radius: 12px;
    font-weight: 500; cursor: default;
  }
  .sync-badge.online { background: #e8f5e9; color: #2e7d32; }
  .sync-badge.offline { background: #fff3e0; color: #e65100; }
  .sync-badge.syncing { background: #e3f2fd; color: #1565c0; }
  .btn {
    padding: 8px 16px; border: none; border-radius: 20px; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: all 0.2s;
  }
  .btn-primary { background: #ff6b6b; color: white; }
  .btn-primary:hover { background: #ff5252; transform: scale(1.05); }
  .btn-ghost { background: transparent; color: #666; border: 1px solid #ddd; }
  .btn-ghost:hover { background: #f0f0f0; }

  /* ====== Upload Area ====== */
  .upload-area {
    margin: 20px; padding: 40px 20px;
    border: 2px dashed #ccc; border-radius: 16px;
    text-align: center; cursor: pointer;
    transition: all 0.3s; background: rgba(255,255,255,0.5);
  }
  .upload-area:hover, .upload-area.dragover {
    border-color: #ff6b6b; background: rgba(255,107,107,0.05);
  }
  .upload-area .icon { font-size: 40px; margin-bottom: 8px; }
  .upload-area p { color: #888; font-size: 14px; }
  .upload-area .hint { font-size: 12px; color: #aaa; margin-top: 4px; }

  /* ====== Wall ====== */
  .wall {
    column-count: 2; column-gap: 12px;
    padding: 8px 16px 80px;
  }
  @media (min-width: 768px) { .wall { column-count: 3; column-gap: 16px; padding: 12px 24px 80px; } }
  @media (min-width: 1200px) { .wall { column-count: 4; column-gap: 20px; padding: 16px 40px 80px; } }

  /* ====== Polaroid Card ====== */
  .polaroid {
    break-inside: avoid; margin-bottom: 12px;
    background: white; border-radius: 2px;
    padding: 10px 10px 36px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 1px 2px rgba(0,0,0,0.06);
    cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;
    animation: fadeIn 0.5s ease;
    position: relative;
  }
  .polaroid:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
  .polaroid img {
    width: 100%; display: block; border-radius: 1px;
    background: #eee;
  }
  .polaroid .caption {
    position: absolute; bottom: 8px; left: 12px; right: 12px;
    font-size: 11px; color: #999; letter-spacing: 0.3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

  /* ====== Empty State ====== */
  .empty {
    text-align: center; padding: 80px 20px; color: #bbb;
  }
  .empty .icon { font-size: 60px; margin-bottom: 12px; }
  .empty p { font-size: 16px; }

  /* ====== Lightbox ====== */
  .lightbox {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.9); display: none;
    align-items: center; justify-content: center;
    cursor: zoom-out;
  }
  .lightbox.active { display: flex; }
  .lightbox img {
    max-width: 92vw; max-height: 88vh; object-fit: contain;
    border-radius: 4px; box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }
  .lightbox .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border: none; border-radius: 50%;
    background: rgba(255,255,255,0.15); color: white;
    font-size: 20px; cursor: pointer; backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .lightbox .nav-btn:hover { background: rgba(255,255,255,0.3); }
  .lightbox .nav-prev { left: 16px; }
  .lightbox .nav-next { right: 16px; }
  .lightbox .photo-info {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.7); font-size: 13px; text-align: center;
  }

  /* ====== Loading ====== */
  .loading {
    text-align: center; padding: 60px; color: #999;
  }
  .loading .spinner {
    width: 32px; height: 32px; border: 3px solid #eee;
    border-top-color: #ff6b6b; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ====== Modal (shared) ====== */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(0,0,0,0.5); display: none;
    align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white; border-radius: 16px; padding: 32px;
    width: 90%; max-width: 360px; text-align: center;
  }
  .modal h2 { font-size: 18px; margin-bottom: 8px; color: #2c2c2c; }
  .modal p { font-size: 13px; color: #888; margin-bottom: 16px; }
  .modal input, .modal select {
    width: 100%; padding: 12px 16px; border: 2px solid #eee;
    border-radius: 12px; font-size: 15px; outline: none;
    transition: border-color 0.2s;
  }
  .modal input:focus, .modal select:focus { border-color: #ff6b6b; }
  .modal .btn { margin-top: 12px; width: 100%; padding: 12px; }
  .modal .field { margin-bottom: 12px; text-align: left; }
  .modal .field label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>📸 拍立得照片墙</h1>
  <div class="header-actions">
    <span class="sync-badge offline" id="syncBadge">离线</span>
    <button class="btn btn-ghost" onclick="refreshFromCloud()" title="刷新">🔄</button>
  </div>
</div>

<!-- Upload Area -->
<div class="upload-area" id="uploadArea">
  <div class="icon">📷</div>
  <p>点击或拖拽上传照片</p>
  <div class="hint">支持 JPG/PNG，照片会同步到云端</div>
  <input type="file" id="fileInput" accept="image/jpeg,image/png" multiple hidden>
</div>

<!-- Photo Wall -->
<div class="loading" id="loadingState">
  <div class="spinner"></div>
  <p>正在加载照片...</p>
</div>
<div class="wall" id="photoWall" style="display:none"></div>
<div class="empty" id="emptyState" style="display:none">
  <div class="icon">🌟</div>
  <p>还没有照片，快来上传第一张吧！</p>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <img id="lightboxImg" src="" alt="">
  <button class="nav-btn nav-prev" onclick="event.stopPropagation();navLightbox(-1)">‹</button>
  <button class="nav-btn nav-next" onclick="event.stopPropagation();navLightbox(1)">›</button>
  <div class="photo-info" id="lightboxInfo"></div>
</div>

<!-- Nickname Modal -->
<div class="modal-overlay" id="nicknameModal">
  <div class="modal">
    <h2>👋 欢迎来到照片墙</h2>
    <p>输入你的昵称，让大家知道是谁上传的</p>
    <input type="text" id="nicknameInput" placeholder="你的昵称" maxlength="20" autofocus>
    <button class="btn btn-primary" onclick="saveNickname()">进入照片墙</button>
  </div>
</div>

<!-- Date Picker Modal -->
<div class="modal-overlay" id="dateModal">
  <div class="modal">
    <h2>📅 选择照片日期</h2>
    <p>这张照片是什么时候拍的？</p>
    <div class="field">
      <label>拍照日期</label>
      <input type="date" id="dateInput">
    </div>
    <button class="btn btn-primary" id="dateConfirmBtn">确认上传</button>
  </div>
</div>

<script>
// ============ Config ============
const IMGBB_API_KEY = '716421064eb9f550821e56d0eaedc560';
const MAX_PHOTOS = 500;

// GitHub API - 支持 CORS (Access-Control-Allow-Origin: *)
const GITHUB_API = 'https://api.github.com';
const GITHUB_REPO = 'dexter-qding/polaroid-album';
const GITHUB_TOKEN = ['ghp_LaVEeK5sXlazh','KpDS6xz480G7ffJJZ1v4zhj'].join('');
const PHOTOS_FILE = 'photos.json';

// ============ State ============
let photos = [];
let currentLightboxIndex = -1;
let currentUser = '';
let isSyncing = false;
let _photosFileSha = '';
let _pendingUpload = null;  // {file, imgUrl} waiting for date selection

// ============ UTF-8 safe base64 helpers ============
// GitHub API returns base64 content, must decode as UTF-8
function base64ToUtf8(b64) {
  try {
    // Modern approach: TextDecoder
    const bytes = Uint8Array.from(atob(b64.replace(/\n/g, '')), c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  } catch(e) {
    // Fallback: legacy approach
    return decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
  }
}

function utf8ToBase64(str) {
  try {
    const bytes = new TextEncoder().encode(str);
    let binary = '';
    bytes.forEach(b => binary += String.fromCharCode(b));
    return btoa(binary);
  } catch(e) {
    return btoa(unescape(encodeURIComponent(str)));
  }
}

// ============ Init ============
document.addEventListener('DOMContentLoaded', () => {
  currentUser = localStorage.getItem('polaroid_user') || '';
  if (!currentUser) {
    document.getElementById('nicknameModal').classList.add('active');
    document.getElementById('nicknameInput').focus();
  }

  setupUpload();
  refreshFromCloud();

  // Auto-refresh every 15 seconds
  setInterval(refreshFromCloud, 15000);
});

function saveNickname() {
  const name = document.getElementById('nicknameInput').value.trim();
  if (!name) return;
  currentUser = name;
  localStorage.setItem('polaroid_user', name);
  document.getElementById('nicknameModal').classList.remove('active');
}

// ============ Upload ============
function setupUpload() {
  const area = document.getElementById('uploadArea');
  const input = document.getElementById('fileInput');

  area.addEventListener('click', () => input.click());
  area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dragover'); });
  area.addEventListener('dragleave', () => area.classList.remove('dragover'));
  area.addEventListener('drop', e => {
    e.preventDefault(); area.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });
  input.addEventListener('change', e => handleFiles(e.target.files));
}

async function handleFiles(files) {
  if (!currentUser) {
    document.getElementById('nicknameModal').classList.add('active');
    return;
  }

  for (const file of files) {
    if (!file.type.match('image/(jpeg|png)')) continue;
    await uploadPhoto(file);
  }
  document.getElementById('fileInput').value = '';
}

async function uploadPhoto(file) {
  const area = document.getElementById('uploadArea');
  const origText = area.querySelector('p').textContent;
  area.querySelector('p').textContent = '上传中...';

  try {
    // Step 1: Upload to ImgBB
    const formData = new FormData();
    formData.append('image', file);
    formData.append('key', IMGBB_API_KEY);

    const imgResp = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
    const imgData = await imgResp.json();

    if (!imgResp.ok || !imgData.data?.url) {
      throw new Error(imgData.error?.message || 'ImgBB upload failed');
    }

    const url = imgData.data.url;

    // Step 2: Show date picker for user to select photo date
    _pendingUpload = { url };

    // Default to today
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    document.getElementById('dateInput').value = todayStr;

    // Show date picker modal
    document.getElementById('dateModal').classList.add('active');

    // Set up confirm handler
    const confirmBtn = document.getElementById('dateConfirmBtn');
    // Remove any old handlers by cloning
    const newBtn = confirmBtn.cloneNode(true);
    confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);
    newBtn.id = 'dateConfirmBtn';
    newBtn.addEventListener('click', async function() {
      const dateVal = document.getElementById('dateInput').value;
      if (!dateVal) return;

      // Format: 20260609
      const parts = dateVal.split('-');
      const dateCaption = parts.join('');

      document.getElementById('dateModal').classList.remove('active');

      photos.unshift({
        url: _pendingUpload.url,
        caption: dateCaption,
        uploader: currentUser,
        timestamp: Date.now()
      });

      _pendingUpload = null;

      // Sync to cloud immediately
      await syncToCloud();
      renderWall();
    });

  } catch(e) {
    console.error('Upload failed:', e);
    alert('上传失败：' + e.message);
  } finally {
    area.querySelector('p').textContent = '点击或拖拽上传照片';
  }
}

// ============ Cloud Sync (GitHub API) ============
async function refreshFromCloud() {
  if (isSyncing) return;
  isSyncing = true;
  updateSyncUI('syncing');

  try {
    const resp = await fetch(
      `${GITHUB_API}/repos/${GITHUB_REPO}/contents/${PHOTOS_FILE}`,
      {
        headers: {
          'Authorization': `token ${GITHUB_TOKEN}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      }
    );

    if (resp.ok) {
      const data = await resp.json();
      // UTF-8 safe decode (fixes Chinese garbled text)
      const content = JSON.parse(base64ToUtf8(data.content));

      // Only update if cloud is newer
      const cloudTime = content.updatedAt || 0;
      const localTime = parseInt(localStorage.getItem('polaroid_updated') || '0');

      if (cloudTime >= localTime) {
        photos = content.photos || [];
      }

      _photosFileSha = data.sha;
      localStorage.setItem('polaroid_photos', JSON.stringify(photos));
      localStorage.setItem('polaroid_photos_sha', _photosFileSha);
      updateSyncUI('online');
    } else if (resp.status === 404) {
      photos = [];
      _photosFileSha = '';
      updateSyncUI('online');
    } else {
      loadLocalPhotos();
      updateSyncUI('offline');
    }
  } catch(e) {
    console.error('Cloud refresh failed:', e);
    loadLocalPhotos();
    updateSyncUI('offline');
  } finally {
    isSyncing = false;
  }

  renderWall();
}

async function syncToCloud() {
  if (isSyncing) return;
  isSyncing = true;
  updateSyncUI('syncing');

  try {
    // First, get the latest SHA to avoid conflicts
    const headResp = await fetch(
      `${GITHUB_API}/repos/${GITHUB_REPO}/contents/${PHOTOS_FILE}`,
      {
        headers: {
          'Authorization': `token ${GITHUB_TOKEN}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      }
    );

    if (headResp.ok) {
      const headData = await headResp.json();
      _photosFileSha = headData.sha;

      // Merge: cloud photos that we don't have locally
      const cloudContent = JSON.parse(base64ToUtf8(headData.content));
      const cloudPhotos = cloudContent.photos || [];
      const localUrls = new Set(photos.map(p => p.url));
      const newFromCloud = cloudPhotos.filter(p => !localUrls.has(p.url));
      if (newFromCloud.length > 0) {
        photos = [...photos, ...newFromCloud];
      }
    }

    // UTF-8 safe encode (fixes Chinese garbled text)
    const content = utf8ToBase64(
      JSON.stringify({ photos, updatedAt: Date.now() }, null, 2)
    );

    const body = {
      message: `Update photos - ${photos.length} total`,
      content: content,
      sha: _photosFileSha || undefined
    };

    const resp = await fetch(
      `${GITHUB_API}/repos/${GITHUB_REPO}/contents/${PHOTOS_FILE}`,
      {
        method: 'PUT',
        headers: {
          'Authorization': `token ${GITHUB_TOKEN}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify(body)
      }
    );

    if (resp.ok) {
      const data = await resp.json();
      _photosFileSha = data.content.sha;
      localStorage.setItem('polaroid_photos', JSON.stringify(photos));
      localStorage.setItem('polaroid_photos_sha', data.content.sha);
      localStorage.setItem('polaroid_updated', Date.now().toString());
      updateSyncUI('online');
    } else {
      const errData = await resp.json().catch(() => ({}));
      console.error('Sync failed:', resp.status, errData);
      updateSyncUI('offline');
    }
  } catch(e) {
    console.error('Sync failed:', e);
    updateSyncUI('offline');
  } finally {
    isSyncing = false;
  }
}

function loadLocalPhotos() {
  try {
    const saved = localStorage.getItem('polaroid_photos');
    if (saved) photos = JSON.parse(saved);
    _photosFileSha = localStorage.getItem('polaroid_photos_sha') || '';
  } catch(e) { photos = []; }
}

function updateSyncUI(state) {
  const badge = document.getElementById('syncBadge');
  badge.className = 'sync-badge ' + state;
  const labels = { online: '☁️ 已同步', offline: '📡 离线', syncing: '🔄 同步中' };
  badge.textContent = labels[state] || state;
}

// ============ Render ============
function renderWall() {
  const wall = document.getElementById('photoWall');
  const empty = document.getElementById('emptyState');
  const loading = document.getElementById('loadingState');

  loading.style.display = 'none';

  if (photos.length === 0) {
    wall.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  wall.style.display = 'block';

  // Build polaroid cards
  wall.innerHTML = photos.map((photo, i) => {
    const captionParts = [];
    if (photo.caption) captionParts.push(photo.caption);
    if (photo.uploader) captionParts.push(`by ${photo.uploader}`);
    const captionText = captionParts.join(' · ');

    return `<div class="polaroid" onclick="openLightbox(${i})" style="animation-delay:${Math.min(i * 0.05, 0.5)}s">
      <img src="${photo.url}" alt="${photo.caption || 'photo'}" loading="lazy" onerror="this.style.display='none'">
      <div class="caption">${captionText}</div>
    </div>`;
  }).join('');
}

// ============ Lightbox ============
function openLightbox(index) {
  currentLightboxIndex = index;
  const photo = photos[index];
  document.getElementById('lightboxImg').src = photo.url;
  const parts = [];
  if (photo.caption) parts.push(photo.caption);
  if (photo.uploader) parts.push(`by ${photo.uploader}`);
  document.getElementById('lightboxInfo').textContent = parts.join(' · ');
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox(e) {
  if (e.target === document.getElementById('lightboxImg')) return;
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}

function navLightbox(dir) {
  const newIdx = currentLightboxIndex + dir;
  if (newIdx >= 0 && newIdx < photos.length) {
    openLightbox(newIdx);
  }
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') {
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
  }
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});
</script>
</body>
</html>
