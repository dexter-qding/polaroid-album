<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📸 拍立得照片墙 - 管理后台</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #f5f0eb;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh; padding: 24px;
  }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 8px; color: #2c2c2c; }
  h2 { font-size: 16px; margin: 24px 0 12px; color: #555; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 24px; }
  .card {
    background: white; border-radius: 12px; padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 16px;
  }
  .status-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid #f0f0f0;
  }
  .status-row:last-child { border-bottom: none; }
  .status-label { font-size: 13px; color: #888; }
  .status-value { font-size: 13px; color: #2c2c2c; font-weight: 500; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 600;
  }
  .badge-green { background: #e8f5e9; color: #2e7d32; }
  .badge-red { background: #ffebee; color: #c62828; }
  .btn {
    padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 600; transition: all 0.2s;
    margin-top: 12px; margin-right: 8px;
  }
  .btn-primary { background: #ff6b6b; color: white; }
  .btn-primary:hover { background: #ff5252; }
  .btn-danger { background: #e53935; color: white; }
  .btn-danger:hover { background: #c62828; }
  .btn-ghost { background: transparent; color: #666; border: 1px solid #ddd; }
  .btn-ghost:hover { background: #f0f0f0; }
  .photo-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px; margin-top: 12px;
  }
  .photo-item {
    position: relative; border-radius: 8px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  .photo-item img {
    width: 100%; height: 140px; object-fit: cover; display: block;
  }
  .photo-item .info {
    padding: 6px 8px; background: white; font-size: 11px; color: #888;
  }
  .photo-item .delete-btn {
    position: absolute; top: 4px; right: 4px;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(229,57,53,0.85); color: white;
    border: none; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.2s;
  }
  .photo-item:hover .delete-btn { opacity: 1; }
  .log { background: #1a1a2e; color: #0ff; padding: 16px; border-radius: 8px;
    font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto;
    margin-top: 12px;
  }
  .log div { margin-bottom: 2px; }
  .log .err { color: #ff6b6b; }
  .log .ok { color: #69f0ae; }
  a { color: #ff6b6b; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>📸 管理后台</h1>
  <p class="subtitle">拍立得照片墙 · GitHub Cloud Sync</p>

  <div class="card">
    <h2>☁️ 云同步状态</h2>
    <div class="status-row">
      <span class="status-label">数据存储</span>
      <span class="status-value"><span class="badge badge-green">GitHub API</span></span>
    </div>
    <div class="status-row">
      <span class="status-label">仓库</span>
      <span class="status-value">dexter-qding/polaroid-album</span>
    </div>
    <div class="status-row">
      <span class="status-label">照片数量</span>
      <span class="status-value" id="photoCount">加载中...</span>
    </div>
    <div class="status-row">
      <span class="status-label">最后更新</span>
      <span class="status-value" id="lastUpdate">-</span>
    </div>
    <div class="status-row">
      <span class="status-label">公开页面</span>
      <span class="status-value"><a href="album.html">📸 打开照片墙</a></span>
    </div>
    <button class="btn btn-primary" onclick="refreshData()">🔄 刷新数据</button>
    <button class="btn btn-danger" onclick="clearAllPhotos()">🗑️ 清空所有照片</button>
  </div>

  <div class="card">
    <h2>📋 照片列表</h2>
    <div class="photo-grid" id="photoGrid">
      <p style="color:#888; font-size:13px;">加载中...</p>
    </div>
  </div>

  <div class="card">
    <h2>📜 操作日志</h2>
    <div class="log" id="logBox"></div>
  </div>
</div>

<script>
const GITHUB_API = 'https://api.github.com';
const GITHUB_REPO = 'dexter-qding/polaroid-album';
const GITHUB_TOKEN = ['ghp_LaVEeK5sXlazh','KpDS6xz480G7ffJJZ1v4zhj'].join('');
const PHOTOS_FILE = 'photos.json';

let photos = [];
let _photosFileSha = '';

// UTF-8 safe base64 helpers (fixes Chinese garbled text)
function base64ToUtf8(b64) {
  try {
    const bytes = Uint8Array.from(atob(b64.replace(/\n/g, '')), c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  } catch(e) {
    return decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
  }
}
function utf8ToBase64(str) {
  try {
    const bytes = new TextEncoder().encode(str);
    let binary = '';
    bytes.forEach(b => binary += String.fromCharCode(b));
    return btoa(binary);
  } catch(e) {
    return btoa(unescape(encodeURIComponent(str)));
  }
}

function log(msg, type='') {
  const box = document.getElementById('logBox');
  const time = new Date().toLocaleTimeString();
  box.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
  box.scrollTop = box.scrollHeight;
}

async function fetchPhotos() {
  log('从 GitHub 读取 photos.json...');
  try {
    const resp = await fetch(
      `${GITHUB_API}/repos/${GITHUB_REPO}/contents/${PHOTOS_FILE}`,
      {
        headers: {
          'Authorization': `token ${GITHUB_TOKEN}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(base64ToUtf8(data.content));
      photos = content.photos || [];
      _photosFileSha = data.sha;
      log(`读取成功：${photos.length} 张照片`, 'ok');
      return true;
    } else {
      log(`读取失败：HTTP ${resp.status}`, 'err');
      return false;
    }
  } catch(e) {
    log(`读取异常：${e.message}`, 'err');
    return false;
  }
}

async function savePhotos() {
  log('保存到 GitHub...');
  try {
    const content = utf8ToBase64(
      JSON.stringify({ photos, updatedAt: Date.now() }, null, 2)
    );

    const resp = await fetch(
      `${GITHUB_API}/repos/${GITHUB_REPO}/contents/${PHOTOS_FILE}`,
      {
        method: 'PUT',
        headers: {
          'Authorization': `token ${GITHUB_TOKEN}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify({
          message: `Admin: ${photos.length} photos`,
          content: content,
          sha: _photosFileSha
        })
      }
    );

    if (resp.ok) {
      const data = await resp.json();
      _photosFileSha = data.content.sha;
      log(`保存成功，新 SHA: ${_photosFileSha.slice(0,8)}...`, 'ok');
      return true;
    } else {
      const err = await resp.json().catch(() => ({}));
      log(`保存失败：${err.message || resp.status}`, 'err');
      return false;
    }
  } catch(e) {
    log(`保存异常：${e.message}`, 'err');
    return false;
  }
}

async function refreshData() {
  const ok = await fetchPhotos();
  if (ok) {
    document.getElementById('photoCount').textContent = `${photos.length} 张`;
    const latest = photos.length > 0 ? new Date(photos[0].timestamp).toLocaleString() : '-';
    document.getElementById('lastUpdate').textContent = latest;
    renderGrid();
  }
}

function renderGrid() {
  const grid = document.getElementById('photoGrid');
  if (photos.length === 0) {
    grid.innerHTML = '<p style="color:#888; font-size:13px;">暂无照片</p>';
    return;
  }
  grid.innerHTML = photos.map((p, i) => `
    <div class="photo-item">
      <img src="${p.url}" alt="" loading="lazy">
      <div class="info">${p.caption || ''} · ${p.uploader || ''}</div>
      <button class="delete-btn" onclick="deletePhoto(${i})" title="删除">×</button>
    </div>
  `).join('');
}

async function deletePhoto(index) {
  if (!confirm('确定要删除这张照片吗？')) return;
  photos.splice(index, 1);
  const ok = await savePhotos();
  if (ok) {
    log(`已删除第 ${index+1} 张照片`, 'ok');
    refreshData();
  }
}

async function clearAllPhotos() {
  if (!confirm('⚠️ 确定要清空所有照片吗？此操作不可恢复！')) return;
  if (!confirm('二次确认：真的要删除所有照片吗？')) return;
  photos = [];
  const ok = await savePhotos();
  if (ok) {
    log('已清空所有照片', 'ok');
    refreshData();
  }
}

// Init
refreshData();
</script>
</body>
</html>
